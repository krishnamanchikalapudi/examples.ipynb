[project]
name = "examples.ipynb"
version = "0.1.0"
description = "Notebook examples for Agent, ML, and Data Science examples"
requires-python = ">=3.11"
authors = [
    { name = "Krishna Manchikalapudi" }
]
dependencies = [
]


[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"